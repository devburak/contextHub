# Install at /etc/nginx/snippets/ctxhub-security-headers.conf. Include again in
# locations that define add_header: older Nginx versions do not merge inheritance.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Sandboxed legacy checkout srcdoc needs inline scripts/styles. External scripts
# are restricted to this origin and the existing payment providers; eval is blocked.
# HTTPS media/frames/forms/connect preserve tenant media, arbitrary embeds and 3DS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.paddle.com https://*.iyzipay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https:; frame-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests" always;
